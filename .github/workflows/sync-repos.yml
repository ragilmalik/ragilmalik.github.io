name: Sync GitHub Repositories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PERSONAL_TOKEN || github.token }}

      - name: Fetch GitHub user and repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN || github.token }}
        run: |
          USERNAME="ragilmalik"

          curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/users/$USERNAME" > user.json
          jq '{login, name, bio, location, blog, avatar_url, html_url, public_repos, followers, following, created_at}' user.json > profile.json

          rm -f page_*.json
          for page in $(seq 1 20); do
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/users/$USERNAME/repos?type=public&per_page=100&page=$page&sort=updated" \
              > "page_$page.json"
            if [ "$(jq 'length' "page_$page.json")" = "0" ]; then
              rm -f "page_$page.json"
              break
            fi
          done
          jq -s 'add' page_*.json > repos_all.json
          rm -f page_*.json

          jq '[.[] | {
            id, node_id, name, full_name,
            owner: .owner.login,
            description, language,
            stars: .stargazers_count, stargazers_count,
            forks: .forks_count, forks_count,
            watchers: .watchers_count, watchers_count,
            open_issues: .open_issues_count, open_issues_count,
            updated: (.updated_at | split("T")[0]), updated_at,
            url: .html_url, html_url,
            topics, created_at, pushed_at,
            size, homepage,
            is_fork: .fork, fork, archived, disabled,
            visibility, default_branch,
            license: (if .license then {name: .license.name, spdx_id: .license.spdx_id} else null end)
          }] | sort_by(.updated_at) | reverse' repos_all.json > repos_list.json

          TOTAL=$(jq 'length' repos_all.json)
          ORIG=$(jq '[.[] | select(.fork == false)] | length' repos_all.json)
          FORKS=$(jq '[.[] | select(.fork == true)] | length' repos_all.json)
          FOLLOWERS=$(jq -r '.followers' user.json)
          FOLLOWING=$(jq -r '.following' user.json)
          CREATED_YEAR=$(jq -r '.created_at[0:4]' user.json)
          CURRENT_YEAR=$(date -u +%Y)
          YEARS=$((CURRENT_YEAR - CREATED_YEAR))
          STARS=$(jq '[.[] | .stargazers_count] | add // 0' repos_all.json)

          jq '[.[] | select(.language != null) | .language] | group_by(.) | map({language: .[0], count: length}) | sort_by(.count) | reverse' repos_all.json > lang_stats.json
          TOTAL_LANGS=$(jq 'map(.count) | add // 0' lang_stats.json)
          jq --argjson total "$TOTAL_LANGS" 'map({language, count, percentage: ((.count / $total) * 100 | floor * 100 / 100)})' lang_stats.json > lang_percent.json

          jq '[.[] | .created_at] | map(.[0:7]) | group_by(.) | map({x: .[0], created: length}) | sort_by(.x) | reduce .[] as $item ([]; . + [{x: $item.x, created: $item.created, y: ((if length > 0 then .[-1].y else 0 end) + $item.created)}])' repos_all.json > timeline.json

          jq '[.[] | .topics // []] | flatten | unique | sort' repos_all.json > skills.json
          jq '[.[] | .language // empty] | unique | sort' repos_all.json > languages.json

          jq -s \
            --arg username "$USERNAME" \
            --arg lastUpdated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: $username,
              lastUpdated: $lastUpdated,
              profile: .[0],
              stats: {
                totalRepos: .[1],
                originalRepos: .[2],
                forkedRepos: .[3],
                followers: .[4],
                following: .[5],
                yearsActive: .[6],
                yearsOnGitHub: .[6],
                totalStars: .[7]
              },
              repositories: .[8],
              languageStats: .[9],
              timeline: .[10],
              skills: .[11],
              languages: .[12]
            }' \
            profile.json \
            <(echo "$TOTAL") <(echo "$ORIG") <(echo "$FORKS") <(echo "$FOLLOWERS") <(echo "$FOLLOWING") <(echo "$YEARS") <(echo "$STARS") \
            repos_list.json lang_percent.json timeline.json skills.json languages.json > repos.json

          rm -f user.json profile.json repos_all.json repos_list.json lang_stats.json lang_percent.json timeline.json skills.json languages.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet repos.json; then
            echo "No changes to commit"
          else
            git add repos.json
            git commit -m "Auto-sync: update repository data"
            git push
          fi
