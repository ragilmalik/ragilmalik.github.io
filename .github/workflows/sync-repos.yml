name: Sync GitHub Repositories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PERSONAL_TOKEN || github.token }}

      - name: Fetch GitHub user and repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN || github.token }}
        run: |
          USERNAME="ragilmalik"
          USER=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/users/$USERNAME")

          echo "$USER" | jq '{login, name, bio, location, blog, avatar_url, html_url, public_repos, followers, following, created_at}' > profile.json

          # Fetch all public repos, following pagination
          REPOS=[]
          PAGE=1
          while :; do
            BATCH=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/users/$USERNAME/repos?type=public&per_page=100&page=$PAGE&sort=updated")
            COUNT=$(echo "$BATCH" | jq 'length')
            [ "$COUNT" = "0" ] && break
            REPOS=$(echo "$REPOS" | jq --argjson b "$BATCH" '. + $b')
            PAGE=$((PAGE+1))
          done

          echo "$REPOS" | jq '[.[] | {
            id, node_id, name, full_name,
            owner: .owner.login,
            description, language,
            stars: .stargazers_count, stargazers_count,
            forks: .forks_count, forks_count,
            watchers: .watchers_count, watchers_count,
            open_issues: .open_issues_count, open_issues_count,
            updated: (.updated_at | split("T")[0]), updated_at,
            url: .html_url, html_url,
            topics, created_at, pushed_at,
            size, homepage,
            is_fork: .fork, fork, archived, disabled,
            visibility, default_branch,
            license: (if .license then {name: .license.name, spdx_id: .license.spdx_id} else null end)
          }] | sort_by(.updated_at) | reverse' > repos_list.json

          TOTAL=$(echo "$REPOS" | jq 'length')
          ORIG=$(echo "$REPOS" | jq '[.[] | select(.fork == false)] | length')
          FORKS=$(echo "$REPOS" | jq '[.[] | select(.fork == true)] | length')
          FOLLOWERS=$(echo "$USER" | jq -r '.followers')
          FOLLOWING=$(echo "$USER" | jq -r '.following')
          CREATED_YEAR=$(echo "$USER" | jq -r '.created_at' | cut -d'-' -f1)
          CURRENT_YEAR=$(date -u +%Y)
          YEARS=$((CURRENT_YEAR - CREATED_YEAR))
          STARS=$(echo "$REPOS" | jq '[.[] | .stargazers_count] | add // 0')

          LANG_STATS=$(echo "$REPOS" | jq '[.[] | select(.language != null) | .language] | group_by(.) | map({language: .[0], count: length}) | sort_by(.count) | reverse')
          TOTAL_LANGS=$(echo "$LANG_STATS" | jq 'map(.count) | add // 0')
          LANG_PERCENTAGES=$(echo "$LANG_STATS" | jq --argjson total "$TOTAL_LANGS" 'map({language, count, percentage: ((.count / $total) * 100 | floor * 100 / 100)})')

          TIMELINE=$(echo "$REPOS" | jq '[.[] | .created_at] | map(.[0:7]) | group_by(.) | map({x: .[0], created: length}) | sort_by(.x) | reduce .[] as $item ([]; . + [{x: $item.x, created: $item.created, y: ((if length > 0 then .[-1].y else 0 end) + $item.created)}])')

          SKILLS=$(echo "$REPOS" | jq '[.[] | .topics // []] | flatten | unique | sort')
          LANGUAGES=$(echo "$REPOS" | jq '[.[] | .language // empty] | unique | sort')

          jq -n \
            --arg username "$USERNAME" \
            --argjson totalRepos "$TOTAL" \
            --argjson originalRepos "$ORIG" \
            --argjson forkedRepos "$FORKS" \
            --argjson followers "$FOLLOWERS" \
            --argjson following "$FOLLOWING" \
            --argjson yearsActive "$YEARS" \
            --argjson totalStars "$STARS" \
            --arg lastUpdated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{username: $username, lastUpdated: $lastUpdated,
              stats: {totalRepos: $totalRepos, originalRepos: $originalRepos, forkedRepos: $forkedRepos,
                      followers: $followers, following: $following, yearsActive: $yearsActive,
                      yearsOnGitHub: $yearsActive, totalStars: $totalStars}}' > stats.json

          jq -s \
            --arg username "$USERNAME" \
            --arg lastUpdated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              username: $username,
              lastUpdated: $lastUpdated,
              profile: .[0],
              stats: .[1],
              repositories: .[2],
              languageStats: .[3],
              timeline: .[4],
              skills: .[5],
              languages: .[6]
            }' profile.json stats.json repos_list.json <(echo "$LANG_PERCENTAGES") <(echo "$TIMELINE") <(echo "$SKILLS") <(echo "$LANGUAGES") > repos.json

          rm -f profile.json repos_list.json stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet repos.json; then
            echo "No changes to commit"
          else
            git add repos.json
            git commit -m "Auto-sync: update repository data"
            git push
          fi
